site_name: IGOOR - Documentazione Ufficiale
site_url: https://igoor-noprofit.github.io/docs/it/
docs_dir: ../../docs/it
site_dir: ../../site/it
use_directory_urls: true

theme:
  name: material
  custom_dir: ../../overrides/
  language: it
  logo: assets/images/igoor_eyes.png
  favicon: assets/images/favicon.ico

markdown_extensions:
  - attr_list
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_css:
  - assets/stylesheets/extra.css

extra:
  alternate:
    - name: English
      link: /docs/en/
      lang: en
    - name: Français
      link: /docs/fr/
      lang: fr
    - name: Italiano
      link: /docs/it/
      lang: it

plugins:
  - search:
      lang: it
  - roamlinks
